name: AutoClean
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete completed workflow runs older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100&status=completed&created=<$cutoff" --jq '.workflow_runs[].id' > /tmp/old-runs
          while IFS= read -r id; do
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$id"
          done < /tmp/old-runs
