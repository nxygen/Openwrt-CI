name: AutoBuild
on:
  push:
  schedule:
    - cron: '17 20 * * 6' # 北京时间周日 04:17；下方控制为每两周一次
  workflow_dispatch:
    inputs:
      TARGET:
        description: '选择构建平台'
        required: true
        type: choice
        default: all
        options: [all, X86_64, MediaTek_Mt798X]
      PROXY:
        description: '选择固件内置的代理插件'
        required: true
        type: choice
        default: nikki
        options: [nikki, openclash, momo]
      CONFIG_ONLY:
        description: '仅检查配置，不编译固件'
        required: true
        type: boolean
        default: false
      PACKAGE:
        description: '附加配置，每行一项'
        required: false
        type: string
permissions:
  contents: read
jobs:
  schedule_gate:
    name: Check build schedule
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 2026-11-22 04:17 Beijing is the first scheduled build.
          anchor_day=$(( $(date -u -d '2026-11-21 00:00:00' +%s) / 86400 ))
          current_day=$(( $(date -u +%s) / 86400 ))
          if (( current_day >= anchor_day && ((current_day - anchor_day) / 7) % 2 == 0 )); then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this week's scheduled build."
          fi
  resolve:
    needs: schedule_gate
    if: ${{ needs.schedule_gate.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      lock: ${{ steps.sources.outputs.lock }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: sources
        env:
          WRT_PROXY: ${{ inputs.PROXY || 'nikki' }}
        run: python3 Scripts/resolve_sources.py
  config:
    needs: resolve
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: ${{ fromJSON(inputs.TARGET == 'X86_64' && '["X86_64"]' || inputs.TARGET == 'MediaTek_Mt798X' && '["MediaTek_Mt798X"]' || '["X86_64","MediaTek_Mt798X"]') }}
    uses: ./.github/workflows/OpenWrt-CI.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_LOCK: ${{ needs.resolve.outputs.lock }}
      WRT_PROXY: ${{ inputs.PROXY || 'nikki' }}
      WRT_TEST: ${{ inputs.CONFIG_ONLY || false }}
      WRT_PACKAGE: ${{ inputs.PACKAGE || '' }}
      WRT_THEME: aurora
      WRT_NAME: OpenWrt
      WRT_IP: 192.168.31.1
      WRT_PW: ''
      WRT_SSID: Openwrt
      WRT_WORD: '12345678'
