name: AutoBuild
on:
  push:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      PROXY:
        description: '选择固件内置的代理插件'
        required: true
        type: choice
        default: nikki
        options: [nikki, openclash, momo]
      CONFIG_ONLY:
        description: '仅检查配置，不编译固件'
        required: true
        type: boolean
        default: false
      PACKAGE:
        description: '附加配置，每行一项'
        required: false
        type: string
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      lock: ${{ steps.sources.outputs.lock }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: sources
        env:
          WRT_PROXY: ${{ inputs.PROXY || 'nikki' }}
        run: python3 Scripts/resolve_sources.py
  config:
    needs: resolve
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [X86_64, MediaTek_Mt798X]
    uses: ./.github/workflows/OpenWrt-CI.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_LOCK: ${{ needs.resolve.outputs.lock }}
      WRT_PROXY: ${{ inputs.PROXY || 'nikki' }}
      WRT_TEST: ${{ inputs.CONFIG_ONLY || false }}
      WRT_PACKAGE: ${{ inputs.PACKAGE || '' }}
      WRT_THEME: aurora
      WRT_NAME: OpenWrt
      WRT_IP: 192.168.31.1
      WRT_PW: ''
      WRT_SSID: Openwrt
      WRT_WORD: '12345678'
